# Formatting, lints and the whole test suite on every pull request into main
# and direct pushes to main — the checks AGENTS.md lists under Verification.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # crates/vt builds libghostty-vt from this submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # libghostty-vt is built with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        # Rebuild the crate cache when the Zig version changes.
        with:
          key: zig-${{ env.ZIG_VERSION }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A mirror that cannot be reached should fail in minutes, not retry for ten.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev \
            libxkbcommon-x11-dev libvulkan-dev clang libclang-dev

      # bindgen needs libclang; the Windows runner already carries LLVM.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The app's and daemon's integration suites drive Unix sockets and POSIX
      # shells; on Windows the portable crates' tests run instead, and the app
      # is built but not test-run (its harness is Unix-only until ported).
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --no-fail-fast -p protocol -p daemon -p app-core
