# Formatting, lints and the whole test suite on every pull request into main
# and direct pushes to main — the checks AGENTS.md lists under Verification.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A mirror that cannot be reached should fail in minutes, not retry for ten.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev \
            libxkbcommon-x11-dev libvulkan-dev

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The app's and daemon's integration suites drive Unix sockets and POSIX
      # shells; on Windows the portable crates' tests run instead, and the app
      # is built but not test-run (its harness is Unix-only until ported).
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --no-fail-fast -p protocol -p daemon -p app-core
