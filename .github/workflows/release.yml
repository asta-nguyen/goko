# Builds Goko for macOS (Apple Silicon) and Linux (x86_64, aarch64) and, for a
# tag vX.Y.Z, publishes the archives as a GitHub release together with
# latest.json and install.sh. A manual run builds the same archives and keeps
# them as workflow artifacts only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, script: package-macos.sh }
          # Linux builds on 22.04 so the binaries run on older glibc too.
          - { os: ubuntu-22.04, script: package-linux.sh }
          - { os: ubuntu-22.04-arm, script: package-linux.sh }
          # windows-2022, not windows-latest (Visual Studio 2026, whose C++
          # library needs Clang 22; Zig 0.16 bundles Clang 21).
          - { os: windows-2022, script: package-windows.ps1 }
    runs-on: ${{ matrix.os }}
    steps:
      # crates/vt builds libghostty-vt from this submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # libghostty-vt is built with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        # Rebuild the crate cache when the Zig version changes.
        with:
          key: zig-${{ env.ZIG_VERSION }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A mirror that cannot be reached should fail in minutes, not retry for ten.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev \
            libxkbcommon-x11-dev libvulkan-dev clang libclang-dev

      # bindgen needs libclang; the Windows runner already carries LLVM.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --no-fail-fast -p protocol -p daemon -p app-core

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          SCRIPT: ${{ matrix.script }}
        # The Windows runner defaults to PowerShell; the script below is bash.
        shell: bash
        run: |
          if [ "$IS_TAG" = true ]; then
            version="${TAG#v}"
            # The app reports the Cargo version, so a tag that differs would
            # leave every install believing an update is waiting.
            cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            [ "$version" = "$cargo_version" ] || {
              echo "tag $TAG does not match the Cargo.toml version $cargo_version" >&2
              exit 1
            }
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            base="https://example.invalid"
          fi
          if [ "$SCRIPT" = "package-windows.ps1" ]; then
            pwsh -File "apps/rune/$SCRIPT" -Version "$version" -Base "$base"
          else
            "apps/rune/$SCRIPT" "$version" "$base"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: goko-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.target.json

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: goko-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # One manifest for every platform; the version comes first, as install.sh reads it.
          # `notes` is the CHANGELOG.md entry for this version, which the app shows
          # in Settings → Updates (empty if the entry is missing).
          notes="$(awk -v v="${TAG#v}" '/^## \[/ { on = index($0, "[" v "]") == 4; next } on' CHANGELOG.md)"
          jq -cs --arg version "${TAG#v}" --arg notes "$notes" '{version: $version, targets: add, notes: $notes}' dist/*.target.json > dist/latest.json
          cat dist/latest.json
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/latest.json distribution/install.sh distribution/install.ps1 \
            --title "Goko ${TAG#v}" --generate-notes
