[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
app-core = { path = "../../../crates/app-core" }
base64 = "0.23"
libc = "0.2"
protocol = { path = "../../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
# devtools: Web Inspector in release builds, for WebView memory diagnosis (private API on macOS, fine outside the App Store).
tauri = { version = "=2.12.5", features = ["devtools"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
