[package]
name = "desktop"
version.workspace = true
edition.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "0.23"
libc = "0.2"
protocol = { path = "../../../crates/protocol" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
