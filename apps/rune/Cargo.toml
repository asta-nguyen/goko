[package]
name = "goko-rune"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
app-core = { path = "../../crates/app-core" }
base64 = { workspace = true }
chrono = "0.4"
getrandom = { workspace = true }
lsp-types = { workspace = true }
protocol = { path = "../../crates/protocol" }
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["native-file-dialog"] }
rune-highlights = { git = "https://github.com/anomalyco/rune", rev = "711d9574074baf69c63f4bbf36d6a843581595ce" }
rune-kit = { path = "../../crates/rune-kit", features = ["markdown"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
vt = { path = "../../crates/vt" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = { version = "0.2", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }
