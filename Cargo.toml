[workspace]
members = ["crates/protocol", "crates/daemon", "crates/app-core", "crates/rune-kit", "apps/rune"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.23"
getrandom = { version = "0.3", features = ["std"] }
libc = "0.2"
lsp-types = "0.97"
serde = "1"
serde_json = "1"
tokio = "1"
uuid = { version = "1.29.0", features = ["v4"] }
windows-sys = "0.61"
